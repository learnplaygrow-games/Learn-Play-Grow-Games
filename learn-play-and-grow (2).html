<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}#fbText,#fbTextL,#fbCnt,#fbFrom,#fbFromL,#fbSend{display:none!important}.fbgo{display:flex;align-items:center;justify-content:center;text-decoration:none}</style></head><body>
<title>Learn, Play and Grow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one centred column of chunky block-like tiles on a sage tabletop; each session owns one hue. Single light look, chosen on purpose for a daytime kids' toy. */
  --table:#E4EDE7;
  --paper:#FFFEFA;
  --ink:#25332F;
  --muted:#586964;
  --line:#C4D3CA;
  --wood:#DDB985;
  --wood-d:#BE925A;
  --scrim:rgba(37,51,47,.55);
  --red:#E0443E;
  --blue:#3A7BD5;
  --yellow:#F2B705;
  --green:#3FA34D;
  --display:'Fredoka','Nunito','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 4px 0 rgba(37,51,47,.12);
  --c:#2F6BB8;
  --tint:#DCE8F7;
}
html{background:var(--table)}
body{
  background:var(--table);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-block:20px 36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:560px;margin-inline:auto}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
svg{display:block}

/* Home */
.eyebrow{font:800 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font:700 clamp(32px,9vw,42px)/1.05 var(--display);margin:6px 0 8px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 16px;max-width:36ch}
.langrow{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin:0 0 20px}
.seg{display:inline-flex;background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;border-radius:22px;min-height:44px;padding:0 16px;font:600 16px var(--display);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{
  position:relative;display:flex;flex-direction:column;text-align:left;cursor:pointer;
  background:var(--paper);border:0;border-bottom:5px solid var(--c);border-radius:22px;padding:0;
  box-shadow:var(--shadow);overflow:hidden;transition:transform .12s;
}
.card:active{transform:translateY(3px)}
.card .art{background:var(--tint);display:grid;place-items:center;aspect-ratio:4/3;padding:10px}
.card .art svg{width:86%;height:auto;max-height:100%}
.card .info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px}
.card .area{font:800 12px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.card .name{font:600 21px/1.1 var(--display)}
.card .goal{font-size:14px;color:var(--muted)}
.card.wide{grid-column:1/-1;flex-direction:row}
.card.wide .art{flex:0 0 48%;aspect-ratio:auto;min-height:130px}
.card.wide .info{justify-content:center;flex:1;min-width:0}
.star{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:var(--paper);display:grid;place-items:center;padding:6px;box-shadow:var(--shadow)}
.star svg{width:100%;height:100%}
.vnote{margin:0 0 16px;padding:12px 14px;background:#FFF1C9;border:2px solid #D9A400;border-radius:16px;font-size:15px;color:var(--ink)}
.backhome{margin-bottom:14px}
/* Cover */
.cover{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:8px}
.cover h1{margin:0}
.cover .art{width:min(100%,340px)}
.cover .hi{font:600 clamp(26px,7vw,32px)/1.15 var(--display);margin:0;color:var(--c)}
.cform{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px;background:var(--paper);border-bottom:6px solid var(--wood-d);border-radius:26px;padding:20px 18px;box-shadow:var(--shadow)}
.cform label{font:600 20px var(--display)}
.cform input{box-sizing:border-box;width:100%;min-height:64px;border:3px solid var(--line);border-radius:20px;background:var(--table);font:600 28px var(--display);text-align:center;color:var(--ink);padding:0 12px}
.cform input:focus{outline:3px solid var(--ink);outline-offset:2px;border-color:var(--ink)}
.cform small{color:var(--muted);font-size:14px}
.note{margin:22px 0 0;font-size:14px;color:var(--muted);max-width:44ch}

/* Game frame */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ibtn{
  flex:none;min-width:52px;height:52px;border-radius:26px;border:2px solid var(--line);background:var(--paper);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;cursor:pointer;
  font:600 16px var(--display);box-shadow:var(--shadow);
}
.ibtn svg{width:22px;height:22px}
.ibtn:active{transform:translateY(2px)}
.pill{
  flex:1;min-width:0;background:var(--tint);border:2px solid var(--c);border-radius:26px;padding:4px 14px;
  display:flex;flex-direction:column;justify-content:center;min-height:52px;
}
.pill small{font:800 11px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill b{font:600 17px/1.1 var(--display);white-space:normal}
.prompt{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:20px;padding:12px 12px 12px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.prompt .lead{flex:none;display:flex}
.prompt p{margin:0;flex:1;min-width:0;font:600 19px/1.25 var(--display);text-wrap:balance}
.say{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid var(--c);background:var(--tint);display:grid;place-items:center;cursor:pointer}
.say svg{width:24px;height:24px}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line)}
.dots{display:flex;justify-content:center;gap:10px;margin-top:20px}
.dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--line);background:transparent;transition:background .2s,border-color .2s}
.dots i.on{background:var(--c);border-color:var(--c)}

/* Dress Me Up */
.dress{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:start}
.kid-wrap{background:var(--paper);border-radius:22px;box-shadow:var(--shadow);padding:10px}
.kid{width:100%;height:auto}
.worn{opacity:0;transform-box:fill-box;transform-origin:center}
.worn.on{opacity:1;animation:pop .4s ease-out}
.tray{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cloth,.animal{touch-action:none;user-select:none;-webkit-user-select:none;position:relative;cursor:grab}
.cloth{
  display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--paper);border:0;border-bottom:4px solid var(--wood-d);
  border-radius:16px;padding:8px 4px 6px;font:700 13px var(--body);box-shadow:var(--shadow);
}
.cloth svg{width:100%;height:56px}
.dragging{z-index:20;box-shadow:0 14px 22px rgba(0,0,0,.2);cursor:grabbing}
.cloth.used,.animal.used{background:transparent;box-shadow:none;border:2px dashed var(--line);pointer-events:none}
.cloth.used>*,.animal.used>*{visibility:hidden}

/* Color Hunt + Listen & Do */
.pips{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.pip{width:16px;height:16px;border-radius:50%;border:3px solid var(--line)}
.pip.on{background:var(--pc);border-color:var(--pc)}
.hunt,.lgrid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:12px}
.lgrid{max-width:420px;margin-inline:auto}
.hitem{aspect-ratio:1;background:var(--paper);border:0;border-radius:22px;padding:14px;box-shadow:var(--shadow);cursor:pointer;position:relative}
.hitem>svg{width:100%;height:100%}
.hitem.found{outline:4px solid var(--ink);outline-offset:-4px;animation:pop .35s ease-out}
.tick{display:none;position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--ink);place-items:center}
.tick svg{width:18px;height:18px}
.found .tick{display:grid}
.wlabel{position:absolute;left:8px;right:8px;bottom:8px;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:2px 6px;text-align:center;font:600 20px/1.2 var(--display);text-transform:capitalize}
.wob{animation:wob .45s ease-in-out}

/* Count the Fruits */
.basket{
  background:var(--wood);border-bottom:6px solid var(--wood-d);border-radius:26px;padding:20px 12px;box-shadow:var(--shadow);
  display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:14px;min-height:210px;
}
.fruit{position:relative;width:78px;height:78px;border:0;background:transparent;padding:0;cursor:pointer;transform:rotate(var(--rot,0deg))}
.fruit svg{width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.badge{position:absolute;right:-6px;top:-6px;min-width:32px;height:32px;border-radius:16px;background:var(--ink);color:#fff;font:600 19px var(--display);display:grid;place-items:center;border:2px solid #fff}
.fruit.cheer{animation:pop .5s ease-out}
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:16px}
.num{
  background:var(--paper);border:0;border-bottom:5px solid var(--c);border-radius:16px;padding:10px 0 9px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow);font:600 34px/1 var(--display);
}
.num:active{transform:translateY(3px)}
.num .dr{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:42px;min-height:7px}
.num .dr i{width:7px;height:7px;border-radius:50%;background:var(--c)}

/* Animal Homes */
.animals{display:grid;grid-template-columns:repeat(var(--ic,4),minmax(0,1fr));gap:8px;margin-bottom:14px}
.animal{aspect-ratio:1;background:var(--paper);border:0;border-bottom:4px solid var(--wood-d);border-radius:18px;padding:8px;box-shadow:var(--shadow)}
.animal>svg{width:100%;height:100%}
.animal.sel{outline:4px solid var(--c);outline-offset:2px}
.shelf{display:grid;grid-template-columns:repeat(var(--sc,2),minmax(0,1fr));gap:12px}
.slot{
  background:var(--paper);border:0;border-bottom:5px solid var(--wood-d);border-radius:22px;padding:10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow);font:600 17px var(--display);
}
.slot .art{position:relative;width:100%;max-width:150px;aspect-ratio:1}
.slot .art>svg{width:100%;height:100%}
.tenant{position:absolute;left:50%;top:48%;width:46%;transform:translateX(-50%);animation:pop .4s ease-out}
.tenant svg{width:100%;height:auto}
.slot.filled{background:#F1F8F1}

/* Series tabs + shared game parts */
.tabs{display:flex;gap:2px;background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:3px;box-shadow:var(--shadow);margin-bottom:16px}
.tabs button{flex:1;min-width:0;border:0;background:transparent;border-radius:22px;min-height:44px;padding:0 4px;font:600 15px var(--display);cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.placed{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.placed svg{width:34px;height:34px}
.mn{font:600 26px/1 var(--display);color:var(--c)}
.shd .art svg{filter:brightness(0) opacity(.3)}
.shd.filled .art svg{filter:none}
.numtile{display:grid;place-items:center;width:100%;height:100%;font:600 clamp(40px,12vw,64px)/1 var(--display);color:var(--c)}
.sz{display:flex;width:100%;height:100%;align-items:center;justify-content:center}
.sz svg{width:calc(var(--s) * 100%);height:auto}
.grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;align-content:center;width:100%;height:100%}
.grp svg{width:30%;height:auto}
.ttop{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:14px}
.ttop svg{width:120px;height:120px;background:var(--paper);border-radius:22px;padding:12px;box-shadow:var(--shadow)}
.tcap{margin:0;font:600 22px var(--display)}
.train,.nrow{display:flex;justify-content:center;gap:4px;margin-bottom:14px}
.wg{flex:1 1 0;min-width:0;max-width:92px;aspect-ratio:1}
.wg svg{width:100%;height:100%}
.blank{border:3px dashed var(--c);border-radius:16px;display:grid;place-items:center;font:600 30px var(--display);color:var(--c);box-sizing:border-box}
.ntile{flex:1 1 0;min-width:0;max-width:64px;height:68px;background:var(--paper);border-radius:14px;box-shadow:var(--shadow);display:grid;place-items:center;font:600 32px var(--display)}
.ntile.blank{background:transparent;box-shadow:none}
.sea .hitem{background:#DDF0FA}
.hitem.seq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:auto;padding:10px 6px}
.seq>svg{width:100%;height:auto;aspect-ratio:1}
.cap{font:700 14px/1.1 var(--body);color:var(--muted);text-align:center}
.ordn{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:600 18px var(--display)}
.scene{background:var(--paper);border-radius:22px;padding:10px;box-shadow:var(--shadow);margin-bottom:14px}
.scene svg{width:100%;height:auto;border-radius:14px}
.nextbtn{width:100%}
body.dragmode [data-drop]{outline:3px dashed var(--wood-d);outline-offset:3px}
[data-drop].over{outline:4px solid var(--c)!important;outline-offset:3px;transform:scale(1.03)}
.cloth,.animal{-webkit-touch-callout:none}
.cloth *,.animal *{touch-action:none}

/* Finish + toast */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:20px;z-index:50}
.sheet{max-height:calc(100% - 8px);overflow-y:auto;background:var(--paper);border-radius:28px;padding:28px 24px 24px;text-align:center;max-width:360px;width:100%;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.sheet .big{width:104px;height:104px;margin:0 auto 6px;animation:pop .6s ease-out}
.sheet h2{font:700 32px/1.1 var(--display);margin:0 0 6px}
.sheet p{margin:0 0 20px;color:var(--muted)}
.sheet .remind{background:#E4F2E1;color:var(--ink);border-radius:16px;padding:10px 14px;font-size:15px;margin:0 0 18px}
.sheet .row{display:flex;flex-direction:column;gap:10px}
.fbsheet{text-align:left;max-width:400px}
.fbsheet h2{font-size:26px}
.fbsheet label{display:block;font:600 15px var(--body);margin:0 0 4px}
.fbsheet textarea,.fbsheet input{width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font:16px var(--body);background:#fff;color:var(--ink);margin:0 0 12px}
.fbsheet textarea{min-height:130px;resize:vertical}
.fbsheet textarea:focus,.fbsheet input:focus{outline:3px solid var(--c);border-color:var(--c)}
.fbsheet .cnt{font-size:13px;color:var(--muted);margin:-8px 0 10px;text-align:right}
.fbsheet .msg{font-size:15px;margin:0 0 12px;color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--c);font:600 15px var(--body);text-decoration:underline;cursor:pointer;padding:10px 0;min-height:44px}
.btn{border:0;border-radius:26px;min-height:54px;padding:0 20px;font:600 19px var(--display);cursor:pointer;box-shadow:var(--shadow)}
.btn.main{background:var(--c);color:#fff}
.btn.alt{background:var(--tint);color:var(--ink);border:2px solid var(--c)}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:#fff;border-radius:24px;padding:12px 20px;font:600 18px var(--display);z-index:40;max-width:calc(100vw - 32px);text-align:center;
}
.conf{position:fixed;top:-24px;width:10px;height:14px;border-radius:2px;z-index:60;pointer-events:none;animation:fall 2.6s linear forwards}

@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes fall{to{transform:translateY(112vh) rotate(560deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<main id="app">
  <p class="vnote" id="vnote" role="status" hidden></p>
  <section id="cover" class="cover">
    <p class="eyebrow" id="coverEyebrow"></p>
    <div class="art" id="coverArt"></div>
    <h1>Learn, Play and Grow</h1>
    <p class="hi" id="coverHi"></p>
    <form class="cform" id="coverForm" autocomplete="off">
      <label for="nameInput" id="nameLabel"></label>
      <input id="nameInput" type="text" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false">
      <small id="nameHint"></small>
      <button class="btn main" id="startBtn" type="submit"></button>
    </form>
    <div class="seg" id="coverSeg" role="group">
      <button type="button" data-l="id" aria-pressed="true">Indonesia</button>
      <button type="button" data-l="en" aria-pressed="false">English</button>
    </div>
  </section>
  <section id="home" hidden>
    <button class="ibtn backhome" id="toCover" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span id="toCoverText"></span>
    </button>
    <p class="eyebrow" id="eyebrow"></p>
    <h1>Learn, Play and Grow</h1>
    <p class="lede" id="lede"></p>
    <div class="langrow">
      <span class="eyebrow" id="langLabel"></span>
      <div class="seg" id="langSeg" role="group">
        <button type="button" data-l="id" aria-pressed="true">Indonesia</button>
        <button type="button" data-l="en" aria-pressed="false">English</button>
      </div>
      <button class="ibtn" id="testVoice" type="button"></button>
      <button class="ibtn" id="changeName" type="button"></button>
    </div>
    <div class="tabs" id="seriesTabs" role="group"></div>
    <div class="cards" id="cards"></div>
    <p class="note" id="note"></p>
    <button class="linkbtn" id="openFb" type="button"></button>
  </section>

  <section id="game" hidden>
    <div class="bar">
      <button class="ibtn" id="back" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="pill"><small id="areaName"></small><b id="gameName"></b></div>
      <button class="ibtn" id="langBtn" type="button"></button>
      <button class="ibtn" id="sound" type="button" aria-pressed="true"></button>
    </div>
    <div class="prompt">
      <span class="lead" id="lead"></span>
      <p id="promptText"></p>
      <button class="say" id="replay" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="stage"></div>
    <div class="dots" id="dots" role="img"></div>
  </section>
</main>

<div class="overlay" id="done" hidden role="dialog" aria-modal="true" aria-labelledby="doneTitle">
  <div class="sheet">
    <div class="big" id="bigStar"></div>
    <h2 id="doneTitle"></h2>
    <p id="doneText"></p>
    <p class="remind" id="doneRemind"></p>
    <div class="row">
      <button class="btn main" id="again" type="button"></button>
      <button class="btn alt" id="menu" type="button"></button>
      <button class="linkbtn" id="fbFromDone" type="button" hidden></button>
    </div>
  </div>
</div>
<div class="overlay" id="fb" style="z-index:55" hidden role="dialog" aria-modal="true" aria-labelledby="fbTitle">
  <form class="sheet fbsheet" id="fbForm" autocomplete="off">
    <h2 id="fbTitle"></h2>
    <p id="fbIntro"></p>
    <label for="fbText" id="fbTextL"></label>
    <textarea id="fbText" maxlength="1000"></textarea>
    <div class="cnt" id="fbCnt"></div>
    <label for="fbFrom" id="fbFromL"></label>
    <input id="fbFrom" type="text" maxlength="40">
    <p class="msg" id="fbMsg" role="status" hidden></p>
    <div class="row">
      <a class="btn main fbgo" id="fbGo" href="https://docs.google.com/forms/d/e/1FAIpQLScEi1jAYw2evI9V1QLEi1wRZmg4Fsenu5O0hzgdJf0DtCrq6g/viewform?usp=header" target="_blank" rel="noopener"></a>
      <button class="btn main" id="fbSend" type="submit"></button>
      <button class="btn alt" id="fbClose" type="button"></button>

function draggable(el,opt){
  var sx=0,sy=0,drag=false,active=false,pid=null,block=false,over=null;
  function setOver(z){if(over===z)return;if(over)over.classList.remove('over');over=z;if(z)z.classList.add('over')}
  el.addEventListener('pointerdown',function(e){
    if(e.button>0)return;
    active=true;drag=false;pid=e.pointerId;sx=e.clientX;sy=e.clientY;
    try{el.setPointerCapture(pid)}catch(_){}
  });
  el.addEventListener('pointermove',function(e){
    if(!active||e.pointerId!==pid)return;
    var dx=e.clientX-sx,dy=e.clientY-sy;
    if(!drag&&Math.hypot(dx,dy)>10){drag=true;el.classList.add('dragging');el.style.transition='none';document.body.classList.add('dragmode')}
    if(drag){el.style.transform='translate('+dx+'px,'+dy+'px) scale(1.1)';setOver(zoneAt(e.clientX,e.clientY,el))}
  });
  el.addEventListener('touchmove',function(e){if(active&&drag&&e.cancelable)e.preventDefault()},{passive:false});
  function end(e,cancel){
    if(!active||e.pointerId!==pid)return;
    active=false;
    try{el.releasePointerCapture(pid)}catch(_){}
    document.body.classList.remove('dragmode');setOver(null);
    if(!drag)return;
    block=true;setTimeout(function(){block=false},60);
    el.classList.remove('dragging');
    var ok=false;
    if(!cancel){var zone=zoneAt(e.clientX,e.clientY,el);ok=zone?opt.onDrop(el,zone):false}
    if(ok){el.style.transition='';el.style.transform=''}
    else{el.style.transition='transform .3s cubic-bezier(.3,1.4,.5,1)';el.style.transform=''}
  }
  el.addEventListener('pointerup',function(e){end(e,false)});
  el.addEventListener('pointercancel',function(e){end(e,true)});
  el.addEventListener('click',function(){if(block)return;if(opt.onTap)opt.onTap(el)});
}

function countGame(ART,NAMES,UNIT){
  var counts=shuffle([1,2,3,4,5]).slice(0,4),fr=shuffle(Object.keys(ART)).slice(0,4),r=0;
  setDots(counts.length,0);
  function round(){
    var N=counts[r],f=fr[r],fn=NAMES[f];
    setPrompt(L('Ada berapa '+fn[0]+'? Silakan ketuk tiap '+UNIT[0]+' sambil menghitung.','How many '+fn[1]+' are there? Please tap each '+UNIT[1]+' while you count.'));
    setLead('');
    stage.innerHTML='<div class="basket">'+
      Array.apply(null,{length:N}).map(function(){return '<button class="fruit" type="button" aria-label="'+L(fn[0],fn[2])+'" style="--rot:'+(rand(17)-8)+'deg">'+S(ART[f]())+'<span class="badge" hidden></span></button>'}).join('')+
      '</div><div class="nums">'+
      [1,2,3,4,5].map(function(n){return '<button class="num" type="button" data-n="'+n+'" aria-label="'+n+'"><span>'+n+'</span><span class="dr">'+Array(n+1).join('<i></i>')+'</span></button>'}).join('')+'</div>';
    var counted=0,locked=false;
    var fruits=$$('.fruit');
    fruits.forEach(function(b){
      b.addEventListener('click',function(){
        if(locked)return;
        if(!b.dataset.n){
          counted++;b.dataset.n=counted;
          var bd=$('.badge',b);bd.textContent=counted;bd.hidden=false;
          sfx.pop();
        }
        say(P(NUM[b.dataset.n]));
      });
    });
    $$('.num').forEach(function(b){
      b.addEventListener('click',function(){
        if(locked)return;
        var n=+b.dataset.n;
        if(n===N){
          locked=true;sfx.good();
          fruits.forEach(function(x){x.classList.add('cheer')});
          var m=L('Benar! Ada '+P(NUM[N])+' '+fn[0]+'. Terima kasih!',
                  N===1?'Correct! There is one '+fn[2]+'. Thank you!':'Correct! There are '+P(NUM[N])+' '+fn[1]+'. Thank you!');
          toast(m);say(m);
          r++;setDots(counts.length,r);
          later(function(){if(r>=counts.length)finish();else round()},2600);
        }else{
          wobble(b);sfx.soft();
          say(L('Belum tepat. Silakan hitung lagi, ya. Ketuk satu per satu.','Not quite. Please count again, one by one.'));
          counted=0;
          fruits.forEach(function(x){delete x.dataset.n;var bd=$('.badge',x);bd.hidden=true;bd.textContent=''});
        }
      });
    });
  }
  round();
}

function listen(){
  var plan=['A','A','A','B','B'],r=0,ids=Object.keys(WORDS);
  setDots(plan.length,0);
  function round(){
    var type=plan[r],pick=shuffle(ids);
    var need=type==='A'?1:2;
    var targets=pick.slice(0,need);
    var opts=shuffle(pick.slice(0,type==='A'?3:4));
    var w=function(id){return P(WORDS[id].n)};
    var a=targets[0],b=targets[1];
    var text=type==='A'
      ?L('Silakan tunjuk '+w(a)+'.','Please point to the '+w(a)+'.')
      :L('Silakan tunjuk '+w(a)+', lalu tunjuk '+w(b)+'.','Please point to the '+w(a)+', and then to the '+w(b)+'.');
    setPrompt(text);setLead('');
    stage.innerHTML='<div class="lgrid" style="--cols:'+(type==='A'?3:2)+'">'+
      opts.map(function(id){return '<button class="hitem" type="button" data-w="'+id+'" aria-label="'+w(id)+'">'+WORDS[id].a()+'<span class="tick">'+CHECK+'</span></button>'}).join('')+'</div>';
    var step=0;
    $$('.hitem').forEach(function(btn){
      btn.addEventListener('click',function(){
        var id=btn.dataset.w;
        if(btn.classList.contains('found')){say(w(id));return}
        if(id===targets[step]){
          btn.classList.add('found');step++;sfx.good();
          btn.insertAdjacentHTML('beforeend','<span class="wlabel">'+w(id)+'</span>');
          if(step===need){
            var m=type==='A'
              ?L('Benar, itu '+w(a)+'. Terima kasih!','Yes, that is the '+w(a)+'. Thank you!')
              :L('Benar! '+w(a)+' dan '+w(b)+'. Terima kasih sudah mendengarkan.','Correct! The '+w(a)+' and the '+w(b)+'. Thank you for listening.');
            toast(m);say(m);
            r++;setDots(plan.length,r);
            later(function(){if(r>=plan.length)finish();else round()},2600);
          }else say(L('Benar, itu '+w(a)+'. Sekarang tunjuk '+w(b)+'.','Yes, that is the '+w(a)+'. Now point to the '+w(b)+'.'));
        }else if(need===2&&step===0&&id===targets[1]){
          wobble(btn);sfx.soft();
          say(L('Silakan tunjuk '+w(a)+' dulu, ya.','Please point to the '+w(a)+' first.'));
        }else{
          wobble(btn);sfx.soft();
          say(L('Itu '+w(id)+'. Silakan coba lagi, ya.','That is the '+w(id)+'. Please try again.'));
        }
      });
    });
  }
  round();
}

function animals(){
  var ids=Object.keys(ANI),sel=null,matched=0;
  var aOrder=shuffle(ids),hOrder=shuffle(ids);
  setPrompt(L('Tolong antar setiap hewan pulang ke rumahnya, ya. Silakan seret hewannya ke rumahnya.','Please take each animal home. Drag the animal to its home.'));
  setLead('');
  setDots(ids.length,0);
  stage.innerHTML='<div class="animals">'+
    aOrder.map(function(id){return '<button class="animal" type="button" data-id="'+id+'" aria-label="'+P(ANIN[id])+'">'+S(ANI[id]())+'</button>'}).join('')+
    '</div><div class="shelf">'+
    hOrder.map(function(id){return '<button class="slot" type="button" data-drop="'+id+'" aria-label="'+P(HOMEN[id])+'"><span class="art">'+S(HOME[id]())+'</span><span>'+P(HOMEN[id])+'</span></button>'}).join('')+'</div>';
  function attempt(aid,hid){
    var a=$('.animal[data-id="'+aid+'"]'),slot=$('.slot[data-drop="'+hid+'"]');
    if(aid===hid){
      a.classList.add('used');a.classList.remove('sel');a.disabled=true;sel=null;
      slot.classList.add('filled');
      $('.art',slot).insertAdjacentHTML('beforeend','<span class="tenant">'+S(ANI[aid]())+'</span>');
      sfx.good();matched++;setDots(ids.length,matched);
      if(matched===ids.length)later(finish,1100);else say(P(ANIMSG[aid]));
      return true;
    }
    wobble(slot);sfx.soft();
    say(L('Belum cocok. Silakan coba rumah yang lain, ya.','Not a match yet. Please try another home.'));
    return false;
  }
  $$('.animal').forEach(function(a){
    draggable(a,{
      onTap:function(){
        if(a.disabled)return;
        sel=a.dataset.id;
        $$('.animal').forEach(function(x){x.classList.toggle('sel',x===a)});
        sfx.pop();say(P(ANIN[sel]));
      },
      onDrop:function(el,zone){
        var hid=zone.dataset.drop;
        if(!(hid in HOME))return false;
        return attempt(el.dataset.id,hid);
      }
    });
  });
  $$('.slot').forEach(function(s){
    s.addEventListener('click',function(){
      if(sel&&!s.classList.contains('filled'))attempt(sel,s.dataset.drop);
      else say(P(HOMEN[s.dataset.drop]));
    });
  });
}

          b.classList.add('found');found++;sfx.good();
          if(found===need){
            toast(d.praise);say(d.praise);
            r++;setDots(total,base+r);
            later(function(){if(r>=n){(opt.onDone||finish)()}else round()},2700);
          }else say(m.label);
        }else{
          wobble(b);sfx.soft();
          say(m.wrong||L('Itu '+m.label+'. Silakan coba lagi, ya.','That is '+m.label+'. Please try again.'));
        }
      });
    });
  }
  round();
}

function matcher(o){
  var sel=null,placed=0,total=o.items.length,byId={},tById={},room={},got={};
  o.items.forEach(function(m){byId[m.id]=m;room[m.to]=(room[m.to]||0)+1});
  o.targets.forEach(function(t){tById[t.id]=t;got[t.id]=0});
  total=o.items.filter(function(m){return tById[m.to]}).length;
  setPrompt(o.prompt);setLead('');setDots(total,0);
  stage.innerHTML='<div class="animals" style="--ic:'+(o.icols||4)+'">'+
    shuffle(o.items).map(function(m){return '<button class="animal" type="button" data-id="'+m.id+'" aria-label="'+m.label+'">'+m.html+'</button>'}).join('')+
    '</div><div class="shelf" style="--sc:'+(o.scols||2)+'">'+
    shuffle(o.targets).map(function(t){return '<button class="slot'+(o.reveal?' shd':'')+'" type="button" data-drop="'+t.id+'" aria-label="'+(t.label||t.say||'')+'"><span class="art">'+t.html+'</span>'+(t.label?'<span>'+t.label+'</span>':'')+'<span class="placed"></span></button>'}).join('')+'</div>';
  function attempt(el,slot){
    var m=byId[el.dataset.id];
    if(m.to===slot.dataset.drop){
      el.classList.add('used');el.classList.remove('sel');el.disabled=true;sel=null;
      got[m.to]++;
      if(got[m.to]>=room[m.to])slot.classList.add('filled');
      if(!o.reveal)$('.placed',slot).insertAdjacentHTML('beforeend',m.mini||m.html);
      sfx.good();placed++;setDots(total,placed);
      if(placed===total)later(finish,1100);else say(o.praise(m));
      return true;
    }
    wobble(slot);sfx.soft();
    say(m.wrong||o.wrong||L('Belum cocok. Silakan coba tempat yang lain, ya.','Not a match yet. Please try another place.'));
    return false;
  }
  $$('.animal',stage).forEach(function(a){
    draggable(a,{
      onTap:function(){
        if(a.disabled)return;
        sel=a.dataset.id;
        $$('.animal',stage).forEach(function(x){x.classList.toggle('sel',x===a)});
        sfx.pop();var m=byId[sel];say(m.say||m.label);
      },
      onDrop:function(el,zone){
        if(!(zone.dataset.drop in tById))return false;
        return attempt(el,zone);
      }
    });
  });
  $$('.slot',stage).forEach(function(s){
    s.addEventListener('click',function(){
      if(sel&&!s.classList.contains('filled')){var el=$('.animal[data-id="'+sel+'"]',stage);if(el)attempt(el,s)}
      else{var t=tById[s.dataset.drop];say(t.say||t.label||'')}
    });
  });
}

function sequence(o){
  var i=0,n=o.steps.length;
  setLead('');setDots(n,0);
  stage.innerHTML='<div class="lgrid" style="--cols:'+(o.cols||3)+'">'+
    shuffle(o.steps).map(function(s){return '<button class="hitem seq" type="button" data-id="'+s.id+'" aria-label="'+s.label+'">'+s.html+'<span class="cap">'+s.label+'</span></button>'}).join('')+'</div>';
  function ask(prefix){if(i>=n)return;setPrompt((prefix||'')+L('Langkah '+(i+1)+': ','Step '+(i+1)+': ')+P(o.steps[i].say))}
  ask();
  $$('.hitem',stage).forEach(function(b){
    b.addEventListener('click',function(){
      if(b.classList.contains('found')){say(b.getAttribute('aria-label'));return}
      if(b.dataset.id===o.steps[i].id){
        b.classList.add('found');sfx.good();
        b.insertAdjacentHTML('beforeend','<span class="ordn">'+(i+1)+'</span>');
        i++;setDots(n,i);
        if(i>=n)later(finish,1100);else later(ask,500);
      }else{
        wobble(b);sfx.soft();
        ask(L('Belum tepat. ','Not quite. '));
      }
    });
  });
}

function oppositeWords(){
  var ps=shuffle(OPPS).slice(0,4);
  quiz(4,function(r){
    var pair=ps[r],flip=Math.random()<.5,given=pair[flip?1:0],want=pair[flip?0:1];
    var pool=[];OPPS.forEach(function(p){if(p!==pair)p.forEach(function(c){pool.push(c)})});
    var opts=shuffle([want].concat(shuffle(pool).slice(0,2)));
    var g=P(given.n),w=P(want.n);
    return {cols:3,
      top:'<div class="ttop">'+S(given.d())+'<p class="tcap">'+cap(g)+'</p></div>',
      prompt:L('Ini "'+g+'". Mana kebalikannya? Silakan pilih.','This is "'+g+'". Which one is the opposite? Please choose.'),
      praise:L('Benar! Kebalikan dari '+g+' adalah '+w+'.','Correct! The opposite of '+g+' is '+w+'.'),
      items:opts.map(function(c){return it(P(c.n),S(c.d()),c===want)})};
  });
}

    b.addEventListener('click',function(){

  try{if(window.claude&&claude.use&&!fbDb)claude.use('db').then(function(d){fbDb=d;fbUid=claude.use('user').then(function(u){return u?u.id():null})}).catch(function(){})}catch(e){}
}

$('#fbText').addEventListener('input',function(){$('#fbCnt').textContent=this.value.length+'/1000'});
$('#fbForm').addEventListener('submit',function(e){
  e.preventDefault();
  if(fbSending)return;
  var t=$('#fbText').value.trim();
  if(!t){fbMsg(L('Silakan tulis kritik atau saran terlebih dahulu.','Please write your feedback first.'));return}
  if(!fbDb){fbMsg(L('Maaf, pengiriman belum bisa dilakukan di sini. Tulisan Anda masih tersimpan di kolom ini.','Sorry, sending is not available here yet. Your text is still in the box.'));return}
  fbSending=true;$('#fbSend').disabled=true;
  var rec={text:t,from:$('#fbFrom').value.trim().slice(0,40),lang:lang,at:new Date().toISOString()};
  fbUid.then(function(uid){if(!uid)throw 0;return fbDb.doc('feedback/'+uid).collection('items').add(rec)}).then(function(){
    $('#fbText').value='';$('#fbFrom').value='';
    fbMsg(L('Terima kasih banyak atas kritik dan saran Anda.','Thank you very much for your feedback.'));
    $('#fbCnt').textContent='0/1000';
  }).catch(function(){
    fbMsg(L('Maaf, belum berhasil terkirim. Mohon coba lagi nanti.','Sorry, it could not be sent. Please try again later.'));
  }).then(function(){fbSending=false;$('#fbSend').disabled=false});
});
function finish(){
  if(!cur)return;
  progress[cur.id]=true;save();
  sfx.win();confetti();
  $('#bigStar').innerHTML=S(SHAPES.bintang('#F2B705'));
  var list=GAMES.filter(function(g){return g.series===cur.series});
  var last=list[list.length-1]===cur;
  closing=last&&cur.series===5;
  nextSeries=(last&&cur.series<5)?cur.series+1:0;
  var praise=childName?L(childName+' hebat!','Great job, '+childName+'!'):L('Hebat sekali!','Well done!');
  var effort=L('Kamu sudah berusaha dengan sungguh-sungguh.','You tried your very best.');
  var remind=L('Bermain game boleh, tapi ingat ya, lebih banyak bermain bersama teman, orangtua, dan alam.','Playing games is okay, but remember to spend more time playing with friends, your parents, and in nature.');
  var body=P(cur.finish);
  if(last){
    body+=' '+L('Semua sesi di Seri '+cur.series+' sudah selesai.','All the sessions in Series '+cur.series+' are done.');
    if(closing)remind+=' '+(childName?L('Sampai jumpa lagi, '+childName+'!','See you again, '+childName+'!'):L('Sampai jumpa lagi!','See you again!'));
  }
  $('#menu').textContent=closing?L('Selesai','Finish'):(last?L('Ke menu Seri '+(cur.series+1),'To the Series '+(cur.series+1)+' menu'):L('Pilih sesi lain','Choose another session'));
  $('#menu').className=last?'btn main':'btn alt';
  $('#again').className=last?'btn alt':'btn main';
  $('#menu').style.order=last?'-1':'0';
  $('#doneTitle').textContent=praise;
  $('#doneText').textContent=body+' '+effort;
  $('#doneRemind').textContent=remind;
  say(praise+' '+body+' '+effort+' '+remind);
  $('#fbFromDone').hidden=!closing;
  $('#done').hidden=false;$('#again').focus();
}

function paintSound(){
  var b=$('#sound');b.innerHTML=soundOn?ICON_ON:ICON_OFF;
  b.setAttribute('aria-pressed',String(soundOn));
  b.setAttribute('aria-label',soundOn?L('Suara menyala','Sound on'):L('Suara mati','Sound off'));
}
$('#sound').addEventListener('click',function(){
  soundOn=!soundOn;
  try{localStorage.setItem('pm-sound',soundOn?'on':'off')}catch(e){}
  if(!soundOn)stopSpeech();
  paintSound();
});
$('#testVoice').addEventListener('click',function(){
  if(!soundOn){soundOn=true;try{localStorage.setItem('pm-sound','on')}catch(e){}paintSound()}
  sfx.good();
  say(L('Halo! Selamat datang di Learn, Play and Grow.','Hello! Welcome to Learn, Play and Grow.'));
  setTimeout(function(){
    var s=window.speechSynthesis,msg;
    if(!s||typeof SpeechSynthesisUtterance==='undefined'){
      msg=L('Hasil tes: pembaca suara tidak tersedia di sini. Coba buka halaman ini di Chrome atau Safari.','Test result: speech is not available here. Please try opening this page in Chrome or Safari.');
    }else{
      var n=s.getVoices().length,has=!!pickVoice();
      msg=L('Hasil tes: '+n+' suara terpasang, suara bahasa Indonesia '+(has?'ada':'tidak ada')+'. Bunyi "ting" dari tombol ini dan ucapan dihitung terpisah.',
            'Test result: '+n+' voices installed, English voice '+(has?'found':'not found')+'. The "ting" sound and the spoken voice are separate.');
      if(lang==='en')msg=msg.replace('English voice','English voice');
    }
    toast(msg,6000);
  },900);
});
try{window.speechSynthesis&&window.speechSynthesis.getVoices()}catch(e){}
$('#back').addEventListener('click',showHome);
$('#replay').addEventListener('click',function(){say(promptText.textContent)});
$('#again').addEventListener('click',function(){var id=cur&&cur.id;$('#done').hidden=true;if(id)openGame(id)});
$('#menu').addEventListener('click',function(){
  if(closing){
    closing=false;clearTimers();stopSpeech();cur=null;
    $('#done').hidden=true;$('#game').hidden=true;stage.innerHTML='';
    showCover(false);
  }else{
    if(nextSeries){curSeries=nextSeries;nextSeries=0;try{localStorage.setItem('pm-series',String(curSeries))}catch(e){}}
    showHome();
  }
});

var cs=[[SHAPES.bola('#3A7BD5'),4,40],[SHAPES.bintang('#F2B705'),62,10],[SHAPES.hati('#E0443E'),120,38],[SHAPES.bunga('#E86FA0'),178,10],[SHAPES.daun('#3FA34D'),236,40]];
$('#coverArt').innerHTML=S(cs.map(function(c){return '<g transform="translate('+c[1]+','+c[2]+') scale(.56)">'+c[0]+'</g>'}).join(''),'0 0 300 100');
$('#nameInput').value=childName;
applyStatic();
renderHome();
})();
</script>
